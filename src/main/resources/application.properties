spring.application.name=tds_rodrigo

spring.config.import=optional:file:.env[.properties]

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:tds_rodrigo}
spring.datasource.username=${DB_USER:tds_rodrigo_app}
spring.datasource.password=${DB_PASSWORD:2206}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# grava java.util.UUID como CHAR(36), batendo com o schema.sql (PKs CHAR(36))
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.springdoc.enable-data-rest=false