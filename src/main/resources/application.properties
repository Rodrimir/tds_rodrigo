spring.application.name=tds_rodrigo

spring.datasource.url=jdbc:mariadb://localhost:3307/tds_rodrigo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MARIADB_SECRET:mariadb}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

springdoc.enable-data-rest=false
